<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Shopify Uploader</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f4f6f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      border: 1px solid #e1e3e5;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .07);
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo .icon {
      font-size: 42px;
    }

    .logo h1 {
      font-size: 20px;
      font-weight: 700;
      color: #202223;
      margin-top: 8px;
    }

    .logo p {
      font-size: 13px;
      color: #6d7175;
      margin-top: 4px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #202223;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #c9cccf;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      background: #fff;
    }

    .field input:focus {
      border-color: #008060;
      box-shadow: 0 0 0 3px #00806020;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: #008060;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
      margin-top: 4px;
    }

    .btn:hover {
      background: #006e52;
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .error-msg {
      display: none;
      background: #fce8e6;
      color: #b81c0c;
      border: 1px solid #f4b4af;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 18px;
      text-align: center;
    }

    .error-msg.show {
      display: block;
    }

    .hint {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #8c9196;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo">
      <div class="icon">&#128722;</div>
      <h1>Shopify Middlware API's</h1>
      <p>Sign in to access the admin panel</p>
    </div>

    <div class="error-msg" id="error-msg">Invalid username or password.</div>

    <form id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="admin" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password"
          required />
      </div>
      <button type="submit" class="btn" id="submit-btn">Sign In</button>
    </form>

    <p class="hint">Credentials are set in your <code>.env</code> file</p>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const errEl = document.getElementById('error-msg');
      errEl.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      const body = {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
      };

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        if (res.ok) {
          window.location.href = '/';
        } else {
          errEl.textContent = 'Invalid username or password.';
          errEl.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      } catch {
        errEl.textContent = 'Server error. Is the server running?';
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>

</html>
