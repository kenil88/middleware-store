<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopify Product Uploader</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f4f6f8;
      color: #202223;
      min-height: 100vh;
      padding: 32px 16px;
    }

    .container { max-width: 760px; margin: 0 auto; }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #008060;
    }
    .subtitle { color: #6d7175; font-size: 14px; margin-bottom: 28px; }

    .card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e1e3e5;
      padding: 24px;
      margin-bottom: 20px;
    }

    .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #202223; }

    /* Secret input */
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .field input {
      width: 100%; padding: 8px 12px; border: 1px solid #c9cccf; border-radius: 6px;
      font-size: 14px; outline: none; transition: border-color .15s;
    }
    .field input:focus { border-color: #008060; box-shadow: 0 0 0 2px #00806022; }

    /* Drop zone */
    #dropzone {
      border: 2px dashed #c9cccf;
      border-radius: 10px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      position: relative;
    }
    #dropzone.drag-over { border-color: #008060; background: #f0fdf9; }
    #dropzone.has-file { border-color: #008060; border-style: solid; background: #f0fdf9; }
    #dropzone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    #dropzone .icon { font-size: 36px; margin-bottom: 10px; }
    #dropzone p { font-size: 14px; color: #6d7175; }
    #dropzone strong { color: #008060; }
    #file-name { margin-top: 8px; font-size: 13px; font-weight: 600; color: #202223; }

    /* Buttons */
    .btn-row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
    button {
      padding: 10px 20px; border: none; border-radius: 6px;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .15s;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: #008060; color: #fff; }
    .btn-primary:not(:disabled):hover { background: #006e52; }
    .btn-secondary { background: #f1f2f3; color: #202223; border: 1px solid #c9cccf; }
    .btn-secondary:not(:disabled):hover { background: #e4e5e7; }
    .btn-preview { background: #005bd3; color: #fff; }
    .btn-preview:not(:disabled):hover { background: #0047a7; }
    .btn-test { background: #fff; color: #008060; border: 1.5px solid #008060; }
    .btn-test:not(:disabled):hover { background: #f0fdf9; }

    /* Progress */
    #progress-section { display: none; }
    .progress-bar-wrap {
      background: #f1f2f3; border-radius: 99px; height: 10px; overflow: hidden; margin-bottom: 10px;
    }
    .progress-bar {
      height: 100%; background: #008060; border-radius: 99px;
      width: 0%; transition: width .3s ease;
    }
    .progress-text { font-size: 13px; color: #6d7175; margin-bottom: 12px; }

    /* Log */
    #log {
      max-height: 260px; overflow-y: auto;
      font-size: 12.5px; font-family: 'Courier New', monospace;
      background: #f9fafb; border: 1px solid #e1e3e5; border-radius: 8px;
      padding: 12px; line-height: 1.7;
    }
    .log-ok { color: #008060; }
    .log-err { color: #d72c0d; }
    .log-info { color: #005bd3; }
    .log-warn { color: #b98900; }

    /* Result banner */
    #result-banner {
      display: none;
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 16px;
    }
    #result-banner.success { background: #d3f5e3; color: #00622e; border: 1px solid #95d0b0; }
    #result-banner.partial { background: #fff3cd; color: #856404; border: 1px solid #ffc107; }
    #result-banner.fail { background: #fce8e6; color: #b81c0c; border: 1px solid #f4b4af; }

    /* Preview table */
    #preview-section { display: none; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #f1f2f3; text-align: left; padding: 8px 10px; font-weight: 600; }
    td { padding: 7px 10px; border-top: 1px solid #f1f2f3; }
    tr:hover td { background: #f9fafb; }

    /* Connection badge */
    #conn-badge {
      display: inline-block; padding: 3px 10px; border-radius: 99px;
      font-size: 12px; font-weight: 600; margin-left: 10px; vertical-align: middle;
    }
    .badge-ok { background: #d3f5e3; color: #00622e; }
    .badge-fail { background: #fce8e6; color: #b81c0c; }
    .badge-checking { background: #f1f2f3; color: #6d7175; }
  </style>
</head>
<body>
<div class="container">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
    <h1>&#128722; Shopify Product Uploader</h1>
    <button class="btn-secondary" style="font-size:13px;padding:7px 14px;" onclick="logout()">&#128274; Logout</button>
  </div>
  <p class="subtitle">Upload an XML file to bulk-import products into your Shopify store</p>

  <!-- Connection card -->
  <div class="card">
    <h2>Shopify Connection</h2>
    <button class="btn-test" onclick="testConnection()">&#128279; Test Shopify Connection <span id="conn-badge" class="badge-checking">—</span></button>
  </div>

  <!-- Upload card -->
  <div class="card">
    <h2>Upload XML File</h2>
    <div id="dropzone">
      <input type="file" id="file-input" accept=".xml,text/xml,application/xml" />
      <div class="icon">&#128196;</div>
      <p>Drag &amp; drop your XML file here, or <strong>click to browse</strong></p>
      <p id="file-name"></p>
    </div>
    <div class="btn-row">
      <button class="btn-preview" onclick="previewProducts()" id="btn-preview" disabled>&#128269; Preview Products</button>
      <button class="btn-primary" onclick="uploadProducts()" id="btn-upload" disabled>&#128640; Upload to Shopify</button>
      <a href="/api/sample"><button class="btn-secondary" type="button">&#11015;&#65039; Download Sample XML</button></a>
    </div>
  </div>

  <!-- Progress card -->
  <div class="card" id="progress-section">
    <h2>Upload Progress</h2>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <p class="progress-text" id="progress-text">Starting…</p>
    <div id="log"></div>
    <div id="result-banner"></div>
  </div>

  <!-- Preview card -->
  <div class="card" id="preview-section">
    <h2>Parsed Products Preview</h2>
    <div class="table-wrap">
      <table id="preview-table">
        <thead><tr><th>#</th><th>Title</th><th>Vendor</th><th>Type</th><th>SKU</th><th>Price</th><th>Stock</th><th>Tags</th></tr></thead>
        <tbody id="preview-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  let selectedFile = null;

  fetch('/auth/me').then(r => { if (!r.ok) window.location.href = '/login'; });

  async function logout() {
    await fetch('/auth/logout', { method: 'POST' });
    window.location.href = '/login';
  }

  // ── File selection ────────────────────────────────────────────────────────────
  $('file-input').addEventListener('change', e => setFile(e.target.files[0]));
  const dz = $('dropzone');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', e => {
    e.preventDefault(); dz.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
  });

  function setFile(file) {
    if (!file) return;
    selectedFile = file;
    $('file-name').textContent = `Selected: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
    dz.classList.add('has-file');
    $('btn-preview').disabled = false;
    $('btn-upload').disabled = false;
  }

  // ── Shopify connection test ───────────────────────────────────────────────────
  async function testConnection() {
    const badge = $('conn-badge');
    badge.className = 'badge-checking'; badge.textContent = 'Checking…';
    try {
      const res = await fetch('/api/test');
      if (res.status === 401) { window.location.href = '/login'; return; }
      const data = await res.json();
      badge.className = data.ok ? 'badge-ok' : 'badge-fail';
      badge.textContent  = data.ok ? `✓ ${data.shop}` : `✗ ${data.error || 'Failed'}`;
    } catch { badge.className = 'badge-fail'; badge.textContent = '✗ Error'; }
  }

  // ── Client-side XML parser (no file upload — avoids Vercel 4.5 MB limit) ─────

  function getTag(el, tag) {
    const node = el.getElementsByTagName(tag)[0];
    return node ? node.textContent.trim() : '';
  }

  function parseDynamicsItem(item) {
    const get = tag => getTag(item, tag);
    const attrs = [
      { name: 'Color',            value: get('Attrib_2_Code') },
      { name: 'Compatible Model', value: get('Attrib_3_Code') },
      { name: 'Screen Size',      value: get('Attrib_4_Code') },
    ].filter(a => a.value);

    const optionDefs    = attrs.map(a => ({ name: a.name, values: [a.value] }));
    const variantOptions = {};
    attrs.forEach((a, i) => { variantOptions[`option${i + 1}`] = a.value; });

    const tags = [
      get('Season_Code'), get('Division_Code'), get('Retail_Product_Code'),
      get('Search_Description'), get('VAT_Prod_Posting_Group'), get('Vendor_No'),
    ].filter(Boolean).join(', ');

    const webDesc = get('Web_Description');
    const bodyHtml = webDesc
      ? (webDesc.trimStart().startsWith('<') ? webDesc : `<p>${webDesc}</p>`)
      : '';

    const variant = {
      sku: get('No'),
      price: parseFloat(get('Unit_Price_Including_VAT') || '0').toFixed(2),
      compare_at_price: parseFloat(get('Unit_Price') || '0').toFixed(2),
      barcode: get('BarcodeNo'),
      inventory_management: 'shopify',
      inventory_quantity: parseInt(get('Inventory') || '0', 10),
      taxable: true, requires_shipping: true,
      ...variantOptions,
    };

    const metafields = [
      { namespace: 'dynamics', key: 'record_key',          value: get('Key'),                   type: 'single_line_text_field' },
      { namespace: 'dynamics', key: 'vendor_no',           value: get('Vendor_No'),              type: 'single_line_text_field' },
      { namespace: 'dynamics', key: 'division_code',       value: get('Division_Code'),          type: 'single_line_text_field' },
      { namespace: 'dynamics', key: 'retail_product_code', value: get('Retail_Product_Code'),    type: 'single_line_text_field' },
      { namespace: 'dynamics', key: 'vat_group',           value: get('VAT_Prod_Posting_Group'), type: 'single_line_text_field' },
      { namespace: 'dynamics', key: 'item_family_code',    value: get('Item_Family_Code'),       type: 'single_line_text_field' },
    ].filter(m => m.value);

    const product = {
      title: get('Description') || 'Untitled Product',
      body_html: bodyHtml,
      vendor: get('Attrib_1_Code'),
      product_type: get('Item_Category_Code'),
      tags, status: 'active',
      variants: [variant], metafields,
    };
    if (optionDefs.length) product.options = optionDefs;
    return product;
  }

  function parseGenericProduct(el) {
    const get = tag => getTag(el, tag);
    const variantEls = Array.from(el.getElementsByTagName('variant'));
    const variants = variantEls.length
      ? variantEls.map(v => {
          const gv = tag => getTag(v, tag);
          const vt = { sku: gv('sku'), price: gv('price') || '0.00',
            inventory_management: 'shopify',
            inventory_quantity: parseInt(gv('inventory_quantity') || '0', 10),
            requires_shipping: gv('requires_shipping') !== 'false',
            taxable: gv('taxable') !== 'false',
            weight: parseFloat(gv('weight') || '0'), weight_unit: gv('weight_unit') || 'kg' };
          ['compare_at_price','barcode','option1','option2','option3'].forEach(k => { if (gv(k)) vt[k] = gv(k); });
          return vt;
        })
      : [{ sku: get('sku'), price: get('price') || '0.00', inventory_management: 'shopify',
           inventory_quantity: parseInt(get('inventory_quantity') || '0', 10), option1: 'Default Title' }];

    const imageEls = Array.from(el.getElementsByTagName('image'));
    const images = imageEls.length
      ? imageEls.map(img => ({ src: getTag(img, 'src'), alt: getTag(img, 'alt') })).filter(i => i.src)
      : (get('image_url') ? [{ src: get('image_url') }] : []);

    const optionEls = Array.from(el.getElementsByTagName('option'));
    const options = optionEls.map((o, i) => ({
      name: getTag(o, 'name') || `Option ${i + 1}`,
      values: Array.from(o.getElementsByTagName('value')).map(v => v.textContent.trim()),
    })).filter(o => o.values.length);

    const product = { title: get('title') || 'Untitled Product',
      body_html: get('body_html') || get('description') || '',
      vendor: get('vendor') || '', product_type: get('product_type') || get('category') || '',
      tags: get('tags') || '', status: get('status') || 'active', variants, images };
    if (options.length) product.options = options;
    return product;
  }

  function parseXmlLocally(xmlString) {
    const doc = new DOMParser().parseFromString(xmlString, 'text/xml');
    const err = doc.querySelector('parsererror');
    if (err) throw new Error('Invalid XML: ' + err.textContent.slice(0, 120));

    if (doc.documentElement.localName.toLowerCase().includes('envelope')) {
      const items = Array.from(doc.getElementsByTagName('RetailItemList'));
      if (!items.length) throw new Error('No RetailItemList elements found in SOAP envelope');
      return items.map(parseDynamicsItem);
    }

    const productEls = Array.from(doc.getElementsByTagName('product'));
    if (!productEls.length) throw new Error('No <product> elements found in XML');
    return productEls.map(parseGenericProduct);
  }

  // ── Helpers ───────────────────────────────────────────────────────────────────
  function esc(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function log(msg, cls = 'log-info') {
    const el = $('log');
    const line = document.createElement('div');
    line.className = cls;
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
  }

  function showBanner(cls, text) {
    const b = $('result-banner');
    b.style.display = 'block'; b.className = cls; b.textContent = text;
  }

  async function safeJson(res) {
    const text = await res.text();
    try { return JSON.parse(text); }
    catch { throw new Error(`Server error (${res.status}): ${text.slice(0, 200)}`); }
  }

  // ── Preview (entirely client-side — no server call) ───────────────────────────
  async function previewProducts() {
    if (!selectedFile) return;
    $('btn-preview').disabled = true;
    $('btn-preview').textContent = '⏳ Parsing…';
    $('preview-section').style.display = 'none';

    try {
      const xml = await selectedFile.text();
      const products = parseXmlLocally(xml);

      const tbody = $('preview-body');
      tbody.innerHTML = '';
      products.forEach((p, i) => {
        const v = p.variants?.[0] || {};
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${i+1}</td><td><strong>${esc(p.title)}</strong></td>
          <td>${esc(p.vendor)}</td><td>${esc(p.product_type)}</td>
          <td>${esc(v.sku)}</td><td>${esc(v.price)}</td>
          <td>${esc(String(v.inventory_quantity ?? ''))}</td><td>${esc(p.tags)}</td>`;
        tbody.appendChild(tr);
      });

      $('preview-section').querySelector('h2').textContent = `Parsed Products Preview (${products.length})`;
      $('preview-section').style.display = 'block';
    } catch (e) {
      alert('Parse error: ' + e.message);
    } finally {
      $('btn-preview').disabled = false;
      $('btn-preview').textContent = '🔍 Preview Products';
    }
  }

  // ── Upload (client-parsed → batched JSON POST → /api/upload-products) ─────────
  // Vercel serverless caps request bodies at 4.5 MB; we never send the raw XML.
  // Products are parsed locally then posted 8 at a time as compact JSON.
  const BATCH_SIZE = 8;

  async function uploadProducts() {
    if (!selectedFile) return;
    if (!confirm(`Upload "${selectedFile.name}" to Shopify? This will create new products.`)) return;

    $('btn-upload').disabled = true;
    $('btn-preview').disabled = true;
    $('progress-section').style.display = 'block';
    $('result-banner').style.display = 'none';
    $('log').innerHTML = '';
    $('progress-bar').style.width = '0%';
    $('progress-text').textContent = 'Parsing file…';

    let products;
    try {
      const xml = await selectedFile.text();
      products = parseXmlLocally(xml);
      log(`Parsed ${products.length} product(s). Uploading in batches of ${BATCH_SIZE}…`, 'log-info');
    } catch (err) {
      $('progress-text').textContent = 'Parse failed';
      log(`Parse error: ${err.message}`, 'log-err');
      showBanner('fail', `✗ ${err.message}`);
      $('btn-upload').disabled = false; $('btn-preview').disabled = false;
      return;
    }

    const batches = [];
    for (let i = 0; i < products.length; i += BATCH_SIZE) batches.push(products.slice(i, i + BATCH_SIZE));

    let totalCreated = 0, totalFailed = 0;

    for (let b = 0; b < batches.length; b++) {
      const batch = batches[b];
      const start = b * BATCH_SIZE + 1;
      const end   = Math.min(start + batch.length - 1, products.length);
      $('progress-text').textContent = `Batch ${b+1}/${batches.length} — products ${start}–${end}…`;

      try {
        const res = await fetch('/api/upload-products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ products: batch }),
        });
        if (res.status === 401) { window.location.href = '/login'; return; }

        const data = await safeJson(res);
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

        totalCreated += data.created || 0;
        totalFailed  += data.failed  || 0;
        (data.errors || []).forEach(e =>
          log(`✗ [${start + e.index}] "${e.title}" — ${e.error}`, 'log-err'));

        const pct = Math.round(((b + 1) / batches.length) * 100);
        $('progress-bar').style.width = pct + '%';
        log(`Batch ${b+1}/${batches.length}: ${data.created} created, ${data.failed} failed`,
            data.failed > 0 ? 'log-warn' : 'log-ok');
      } catch (err) {
        log(`Batch ${b+1} error: ${err.message}`, 'log-err');
        totalFailed += batch.length;
      }
    }

    $('progress-bar').style.width = '100%';
    $('progress-text').textContent = 'Complete';

    if (totalFailed === 0) {
      showBanner('success', `✓ All ${totalCreated} product(s) uploaded successfully!`);
      log(`Done — ${totalCreated} created`, 'log-ok');
    } else if (totalCreated > 0) {
      showBanner('partial', `⚠ ${totalCreated} uploaded, ${totalFailed} failed. See log for details.`);
      log(`Done — created: ${totalCreated}, failed: ${totalFailed}`, 'log-warn');
    } else {
      showBanner('fail', `✗ All ${totalFailed} product(s) failed. See log for details.`);
      log(`Done — all ${totalFailed} failed`, 'log-err');
    }

    $('btn-upload').disabled = false; $('btn-preview').disabled = false;
  }
</script>
</body>
</html>
